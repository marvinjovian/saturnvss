<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Dwi. — Creator Dashboard</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <img class="lily-bg lily-1" src="assets/lily.svg" alt="">
  <img class="lily-bg lily-2" src="assets/lily.svg" alt="">

  <!-- Desktop sidebar -->
  <aside class="sidebar desktop-only">
    <div class="sidebar-brand">🌸 Dwi Lestari</div>
    <div class="sidebar-sub">Creator Dashboard</div>
    <nav class="sidebar-nav">
      <div class="nav-item" data-nav="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        Dashboard
      </div>
      <div class="nav-item" data-nav="collabs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 20.5c0-3.6-2.9-6-6.8-6h-4c-3.9 0-6.8 2.4-6.8 6"/><circle cx="12" cy="8" r="4"/></svg>
        Kerja Sama
      </div>
      <div class="nav-item" data-nav="calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        Calendar
      </div>
      <div class="nav-item" data-nav="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        History
      </div>
      <div class="nav-item" data-nav="analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
        Analytics
      </div>
      <div class="nav-item" data-nav="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9"/></svg>
        Settings
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="nav-item" data-nav="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
        Backup Data
      </div>
    </div>
  </aside>

  <div class="main-wrap">
    <!-- Desktop topbar -->
    <div class="topbar desktop-only">
      <div>
        <div class="topbar-greeting display js-greeting">Good morning, Dwi 🌸</div>
        <div class="topbar-subtitle">Let's keep your collaborations organized.</div>
      </div>
      <div class="topbar-actions">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="globalSearch" placeholder="Search brand, PIC, notes...">
        </div>
        <button class="icon-btn" data-action="toggleNotif">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
          <span class="notif-dot"></span>
        </button>
        <div class="profile-chip">DL</div>
      </div>
    </div>

    <!-- Mobile topbar -->
    <div class="mobile-topbar mobile-only">
      <div class="topbar-greeting display js-greeting" style="font-size:17px;">Good morning, Dwi 🌸</div>
      <div class="mobile-topbar-actions">
        <button class="icon-btn" style="width:36px;height:36px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
        <button class="icon-btn" style="width:36px;height:36px;" data-action="toggleNotif">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
          <span class="notif-dot"></span>
        </button>
      </div>
    </div>

    <main class="page" id="pageRoot"></main>
  </div>

  <!-- Bottom nav (mobile) -->
  <nav class="bottom-nav">
    <div class="bn-item" data-nav="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      Home
    </div>
    <div class="bn-item" data-nav="collabs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      Collab
    </div>
    <div class="bn-item" data-nav="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      Calendar
    </div>
    <div class="bn-item" data-nav="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      History
    </div>
  </nav>

  <button class="fab" data-action="addCollab" aria-label="Add collaboration">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- Notification panel -->
  <div class="notif-panel" id="notifPanel"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <!-- Toasts -->
  <div class="toast-wrap" id="toastWrap"></div>
</div>

<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
